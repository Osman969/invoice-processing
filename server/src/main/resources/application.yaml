spring:
  datasource:
    url: jdbc:mysql://mysql:3306/invoiceprocessingsystem
    username: root
    # Not good for production use
    password: ${DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

arrive:
  app:
    pagination:
      default-page-size: 4